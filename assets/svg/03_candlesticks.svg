<svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="150" cy="238" rx="100" ry="12" fill="#1C1F33" opacity="0.06"/>
  <!-- baseline -->
  <line x1="34" y1="200" x2="266" y2="200" stroke="#1C1F33" stroke-opacity="0.12" stroke-width="2"/>
  <!-- candles made of cowrie shells -->
  <g transform="translate(60,0)">
    <line x1="6" y1="90" x2="6" y2="200" stroke="#14B87F" stroke-width="3"/>
    <ellipse cx="6" cy="150" rx="15" ry="34" fill="#14B87F"/>
    <ellipse cx="1" cy="140" rx="4" ry="7" fill="#FBF3E7" opacity="0.5"/>
  </g>
  <g transform="translate(112,0)">
    <line x1="6" y1="70" x2="6" y2="180" stroke="#FF6B4A" stroke-width="3"/>
    <ellipse cx="6" cy="110" rx="15" ry="26" fill="#FF6B4A"/>
    <ellipse cx="1" cy="102" rx="4" ry="6" fill="#FBF3E7" opacity="0.5"/>
  </g>
  <g transform="translate(164,0)">
    <line x1="6" y1="50" x2="6" y2="170" stroke="#14B87F" stroke-width="3"/>
    <ellipse cx="6" cy="95" rx="15" ry="40" fill="#14B87F"/>
    <ellipse cx="1" cy="82" rx="4" ry="8" fill="#FBF3E7" opacity="0.5"/>
  </g>
  <g transform="translate(216,0)">
    <line x1="6" y1="95" x2="6" y2="190" stroke="#FF6B4A" stroke-width="3"/>
    <ellipse cx="6" cy="130" rx="15" ry="24" fill="#FF6B4A"/>
    <ellipse cx="1" cy="123" rx="4" ry="6" fill="#FBF3E7" opacity="0.5"/>
  </g>
  <!-- magnifier pointing at one candle -->
  <circle cx="176" cy="95" r="26" fill="none" stroke="#12183B" stroke-width="4"/>
  <line x1="195" y1="114" x2="212" y2="131" stroke="#12183B" stroke-width="5" stroke-linecap="round"/>
</svg>
